[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-skills-sync"
version = "0.1.0"
description = "Sync personal SKILL.md directories across Claude, Cursor, Copilot, and Codex"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["claude", "cursor", "copilot", "codex", "skills", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
ai-skills-sync = "ai_skills_sync.__main__:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_skills_sync"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
